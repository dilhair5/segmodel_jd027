[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dilhair5-segmodel_jd027"
version = "0.1.0"
description = "按给定权重把总额度分配到各项，报告超分配项与利用率"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "dilhair5" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://dilhair5.github.io"
Repository = "https://github.com/dilhair5/segmodel_jd027"
Issues = "https://github.com/dilhair5/segmodel_jd027/issues"

[project.scripts]
segmodel_jd027 = "segmodel_jd027:main"

[tool.setuptools]
py-modules = ["segmodel_jd027"]
